name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ${{ matrix.config.os }}

    strategy:
      matrix:
        config:
          - { name: win_x64, os: windows-latest, runtime: win-x64, executable: AssetRipper.exe, archive: zip }
          - { name: win_arm64, os: windows-latest, runtime: win-arm64, executable: AssetRipper.exe, archive: zip }
          - { name: linux_x64, os: ubuntu-22.04, runtime: linux-x64, executable: AssetRipper, archive: tar }
          - { name: linux_arm64, os: ubuntu-22.04-arm, runtime: linux-arm64, executable: AssetRipper, archive: tar }
          - { name: mac_x64, os: macos-15, runtime: osx-x64, executable: AssetRipper, archive: tar }
          - { name: mac_arm64, os: macos-15, runtime: osx-arm64, executable: AssetRipper, archive: tar }

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Publish
        run: dotnet publish AssetRipper.slnx -c Release -r ${{ matrix.config.runtime }} --self-contained false

      - name: List Files
        shell: bash
        run: ls -R ./artifacts/publish/

      - name: Record Compile Time
        shell: bash
        run: date -u > ./artifacts/publish/compile_time.txt

      - name: Archive & Upload (zip)
        if: ${{ matrix.config.archive == 'zip' }}
        uses: actions/upload-artifact@v7
        with:
          name: AssetRipper_${{ matrix.config.name }}
          path: |
            ./artifacts/publish/${{ matrix.config.executable }}
            ./artifacts/publish/*.dll
            ./artifacts/publish/*.json
            ./artifacts/publish/*.so
            ./artifacts/publish/*.dylib
            ./artifacts/publish/compile_time.txt
          if-no-files-found: error
    
      - name: Create Archive (tar)
        if: ${{ matrix.config.archive == 'tar' }}
        shell: bash
        working-directory: ./artifacts/publish
        run: tar cvJf "AssetRipper_${{ matrix.config.name }}.tar.xz" "${{ matrix.config.executable }}" compile_time.txt $(ls *.{dll,json,so,dylib} 2>/dev/null)
      
      - name: Upload Archive (tar)
        if: ${{ matrix.config.archive == 'tar' }}
        uses: actions/upload-artifact@v7
        with:
          path: ./artifacts/publish/AssetRipper_${{ matrix.config.name }}.tar.xz
          archive: false # we dont need to archive it twice
